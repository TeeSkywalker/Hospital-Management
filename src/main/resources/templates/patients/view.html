<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Patient')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<div class="d-flex justify-content-between"><h2 th:text="${patient.fullName}"></h2><a class="btn btn-outline-primary btn-sm align-self-start" th:href="@{/patients/edit/{id}(id=${patient.id})}">Edit details</a></div>
<p class="text-muted">
  <span th:text="${patient.gender}"></span> &middot; Born <span th:text="${patient.dateOfBirth}"></span> &middot;
  <span th:text="${patient.phone}"></span> &middot; <span th:text="${patient.email}"></span> &middot; <span th:text="${patient.address}"></span>
</p>
<div sec:authorize="hasAnyRole('ADMIN','DOCTOR','NURSE')" class="card card-body mb-3"><strong>Medical history</strong><div th:text="${patient.medicalHistory}"></div></div>
<div class="mb-4">
  <a class="btn btn-sm btn-primary" th:href="@{/appointments/new}">Book appointment</a>
  <a sec:authorize="hasAnyRole('ADMIN','DOCTOR','NURSE')" class="btn btn-sm btn-primary" th:href="@{/records/new(patientId=${patient.id})}">New medical record</a>
  <a sec:authorize="hasAnyRole('ADMIN','DOCTOR')" class="btn btn-sm btn-primary" th:href="@{/lab/new(patientId=${patient.id})}">Request lab test</a>
</div>

<h5>Appointments</h5>
<table class="table table-sm"><thead><tr><th>Date</th><th>Doctor</th><th>Reason</th><th>Status</th></tr></thead><tbody>
  <tr th:each="x : ${appointments}"><td th:text="${#temporals.format(x.appointmentDate, 'dd MMM yyyy HH:mm')}"></td><td th:text="${x.doctor.fullName}"></td><td th:text="${x.reason}"></td><td th:text="${x.status}"></td></tr>
</tbody></table>

<div sec:authorize="hasAnyRole('ADMIN','DOCTOR','NURSE')">
<h5>Medical records</h5>
<table class="table table-sm"><thead><tr><th>Date</th><th>Doctor</th><th>Diagnosis</th><th></th></tr></thead><tbody>
  <tr th:each="x : ${records}"><td th:text="${#temporals.format(x.visitDate, 'dd MMM yyyy HH:mm')}"></td><td th:text="${x.doctor.fullName}"></td><td th:text="${x.diagnosis}"></td><td><a th:href="@{/records/{id}(id=${x.id})}">Open</a></td></tr>
</tbody></table>
</div>

<div sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
<h5>Lab tests</h5>
<table class="table table-sm"><thead><tr><th>Requested</th><th>Test</th><th>Status</th><th>Result</th></tr></thead><tbody>
  <tr th:each="x : ${labs}"><td th:text="${#temporals.format(x.requestedAt, 'dd MMM yyyy HH:mm')}"></td><td th:text="${x.testName}"></td><td th:text="${x.status}"></td><td th:text="${x.result}"></td></tr>
</tbody></table>
</div>

<h5>Admissions</h5>
<table class="table table-sm"><thead><tr><th>Bed</th><th>Reason</th><th>Admitted</th><th>Discharged</th></tr></thead><tbody>
  <tr th:each="x : ${admissions}"><td th:text="${x.bed.ward + ' ' + x.bed.bedNumber}"></td><td th:text="${x.reason}"></td><td th:text="${#temporals.format(x.admittedAt, 'dd MMM yyyy HH:mm')}"></td><td th:text="${#temporals.format(x.dischargedAt, 'dd MMM yyyy HH:mm')}"></td></tr>
</tbody></table>

<div sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
<h5>Bills</h5>
<table class="table table-sm"><thead><tr><th>Bill</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>
  <tr th:each="x : ${bills}"><td><a th:href="@{/billing/{id}(id=${x.id})}" th:text="'#' + ${x.id}"></a></td><td th:text="${#temporals.format(x.createdAt, 'dd MMM yyyy HH:mm')}"></td><td th:text="${x.total}"></td><td th:text="${x.status}"></td></tr>
</tbody></table>
</div>
<a href="javascript:history.back()">&larr; Back</a>
</div></body></html>
