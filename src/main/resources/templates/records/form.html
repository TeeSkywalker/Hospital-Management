<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Medical Record')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<h2>Medical Record</h2><form th:action="@{/records/save}" th:object="${record}" method="post"><input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Patient</label><select class="form-select" th:field="*{patient.id}"><option th:each="o : ${patients}" th:value="${o.id}" th:text="${o.fullName}"></option></select><div class="text-danger small" th:errors="*{patient}"></div></div>
<div class="mb-3"><label class="form-label">Doctor</label><select class="form-select" th:field="*{doctor.id}"><option th:each="o : ${doctors}" th:value="${o.id}" th:text="${o.fullName}"></option></select><div class="text-danger small" th:errors="*{doctor}"></div></div>
<div class="mb-3"><label class="form-label">Diagnosis</label><input type="text"  class="form-control" th:field="*{diagnosis}"><div class="text-danger small" th:errors="*{diagnosis}"></div></div>
<div class="mb-3"><label class="form-label">Notes</label><textarea rows="4" class="form-control" th:field="*{notes}"></textarea></div>
<button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="/records">Cancel</a></form>
</div></body></html>
