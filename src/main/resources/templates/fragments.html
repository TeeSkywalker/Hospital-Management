<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Hospital Management'">Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:fragment="nav">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">Hospital MS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav me-auto">
          <a sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST','DOCTOR','NURSE')" class="nav-link" th:href="@{/patients}">Patients</a>
          <a sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST','DOCTOR','NURSE')" class="nav-link" th:href="@{/doctors}">Doctors</a>
          <a sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST','DOCTOR','NURSE')" class="nav-link" th:href="@{/appointments}">Appointments</a>
          <a sec:authorize="hasAnyRole('ADMIN','DOCTOR','NURSE')" class="nav-link" th:href="@{/records}">Records</a>
          <a sec:authorize="hasAnyRole('ADMIN','DOCTOR','LAB_TECH')" class="nav-link" th:href="@{/lab}">Lab</a>
          <a sec:authorize="hasAnyRole('ADMIN','PHARMACIST')" class="nav-link" th:href="@{/pharmacy}">Pharmacy</a>
          <a sec:authorize="hasAnyRole('ADMIN','PHARMACIST')" class="nav-link" th:href="@{/pharmacy/prescriptions}">Prescriptions</a>
          <a sec:authorize="hasAnyRole('ADMIN','NURSE','RECEPTIONIST','DOCTOR')" class="nav-link" th:href="@{/wards}">Wards</a>
          <a sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')" class="nav-link" th:href="@{/billing}">Billing</a>
          <a sec:authorize="hasRole('ADMIN')" class="nav-link" th:href="@{/reports}">Reports</a>
          <div sec:authorize="hasRole('ADMIN')" class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Admin</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/departments}">Departments</a></li>
              <li><a class="dropdown-item" th:href="@{/staff}">Staff</a></li>
              <li><a class="dropdown-item" th:href="@{/users}">Users</a></li>
              <li><a class="dropdown-item" th:href="@{/audit}">Audit log</a></li>
            </ul>
          </div>
          <a sec:authorize="hasRole('PATIENT')" class="nav-link" th:href="@{/portal}">My Portal</a>
        </div>
        <span class="navbar-text me-3" sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form>
      </div>
    </div>
  </nav>
  <div class="container" th:if="${error != null or msg != null}">
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${msg != null}" th:text="${msg}"></div>
  </div>
</div>

<nav th:fragment="pager(p, url)" th:if="${p.totalPages > 1}">
  <ul class="pagination">
    <li class="page-item" th:classappend="${p.first} ? 'disabled'"><a class="page-link" th:href="@{${url}(page=${p.number - 1},q=${param.q},doctorId=${param.doctorId},date=${param.date},status=${param.status})}">Previous</a></li>
    <li class="page-item disabled"><span class="page-link" th:text="${p.number + 1} + ' of ' + ${p.totalPages}"></span></li>
    <li class="page-item" th:classappend="${p.last} ? 'disabled'"><a class="page-link" th:href="@{${url}(page=${p.number + 1},q=${param.q},doctorId=${param.doctorId},date=${param.date},status=${param.status})}">Next</a></li>
  </ul>
</nav>
</body>
</html>
