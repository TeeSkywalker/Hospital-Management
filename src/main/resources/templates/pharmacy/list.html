<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Pharmacy - Medicines')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<div class="d-flex justify-content-between mb-3"><h2>Pharmacy - Medicines</h2>
<a class="btn btn-primary" href="/pharmacy/new">+ Add Medicine</a>
</div><table class="table table-striped"><thead><tr>
<th>Name</th>
<th>Stock</th>
<th>Unit price</th>
<th>Expiry date</th>
<th>Reorder level</th>
<th>Status</th>
<th></th></tr></thead><tbody><tr th:each="x : ${medicines}">
<td th:text="${x.name}"></td><td th:text="${x.stock}"></td><td th:text="${x.unitPrice}"></td><td th:text="${x.expiryDate}"></td><td th:text="${x.reorderLevel}"></td><td><span class="badge bg-danger" th:if="${x.stock <= x.reorderLevel}">Low stock</span> <span class="badge bg-warning text-dark" th:if="${x.expiryDate != null and x.expiryDate.isBefore(T(java.time.LocalDate).now())}">Expired</span></td>
<td class="text-end text-nowrap" ><a class="btn btn-sm btn-outline-primary" th:href="@{/pharmacy/edit/{id}(id=${x.id})}">Edit</a>
<form class="d-inline" th:action="@{/pharmacy/delete/{id}(id=${x.id})}" method="post" onsubmit='return confirm("Delete this record?")'><button class="btn btn-sm btn-outline-danger">Delete</button></form></td>
</tr></tbody></table>
</div></body></html>
