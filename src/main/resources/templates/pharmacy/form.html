<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Medicine')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<h2>Medicine</h2><form th:action="@{/pharmacy/save}" th:object="${medicine}" method="post"><input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Name</label><input type="text"  class="form-control" th:field="*{name}"><div class="text-danger small" th:errors="*{name}"></div></div>
<div class="mb-3"><label class="form-label">Stock</label><input type="number"  class="form-control" th:field="*{stock}"><div class="text-danger small" th:errors="*{stock}"></div></div>
<div class="mb-3"><label class="form-label">Unit price</label><input type="number" step="0.01" class="form-control" th:field="*{unitPrice}"><div class="text-danger small" th:errors="*{unitPrice}"></div></div>
<div class="mb-3"><label class="form-label">Expiry date</label><input type="date"  class="form-control" th:field="*{expiryDate}"><div class="text-danger small" th:errors="*{expiryDate}"></div></div>
<div class="mb-3"><label class="form-label">Reorder level</label><input type="number"  class="form-control" th:field="*{reorderLevel}"><div class="text-danger small" th:errors="*{reorderLevel}"></div></div>
<button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="/pharmacy">Cancel</a></form>
</div></body></html>
