<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Appointment')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<h2>Appointment</h2><form th:action="@{/appointments/save}" th:object="${appointment}" method="post"><input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Patient</label><select class="form-select" th:field="*{patient.id}"><option th:each="o : ${patients}" th:value="${o.id}" th:text="${o.fullName}"></option></select><div class="text-danger small" th:errors="*{patient}"></div></div>
<div class="mb-3"><label class="form-label">Doctor</label><select class="form-select" th:field="*{doctor.id}"><option th:each="o : ${doctors}" th:value="${o.id}" th:text="${o.fullName}"></option></select><div class="text-danger small" th:errors="*{doctor}"></div></div>
<div class="mb-3"><label class="form-label">Date and time</label><input type="datetime-local"  class="form-control" th:field="*{appointmentDate}"><div class="text-danger small" th:errors="*{appointmentDate}"></div></div>
<div class="mb-3"><label class="form-label">Reason</label><input type="text"  class="form-control" th:field="*{reason}"><div class="text-danger small" th:errors="*{reason}"></div></div>
<div class="mb-3"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option value="SCHEDULED">SCHEDULED</option><option value="COMPLETED">COMPLETED</option><option value="CANCELLED">CANCELLED</option></select></div>
<button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="/appointments">Cancel</a></form>
</div></body></html>
