<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Lab result')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<h2>Lab result</h2>
<p><strong th:text="${test.testName}"></strong> for <strong th:text="${test.patient.fullName}"></strong> (requested by <span th:text="${test.doctor.fullName}"></span>)</p>
<form th:action="@{/lab/result/{id}(id=${test.id})}" method="post">
  <div class="mb-3"><label class="form-label">Result</label><textarea class="form-control" name="result" rows="5" required th:text="${test.result}"></textarea></div>
  <button class="btn btn-primary">Save result</button> <a class="btn btn-secondary" th:href="@{/lab}">Cancel</a>
</form>
</div></body></html>
