<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Doctors')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<div class="d-flex justify-content-between mb-3"><h2>Doctors</h2>
<a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" href="/doctors/new">+ Add Doctor</a>
</div><table class="table table-striped"><thead><tr>
<th>Name</th>
<th>Specialization</th>
<th>Department</th>
<th>Phone</th>
<th>Email</th>
<th></th></tr></thead><tbody><tr th:each="x : ${doctors}">
<td th:text="${x.fullName}"></td><td th:text="${x.specialization}"></td><td th:text="${x.department?.name}"></td><td th:text="${x.phone}"></td><td th:text="${x.email}"></td>
<td class="text-end text-nowrap" sec:authorize="hasRole('ADMIN')"><a class="btn btn-sm btn-outline-primary" th:href="@{/doctors/edit/{id}(id=${x.id})}">Edit</a>
<form class="d-inline" th:action="@{/doctors/delete/{id}(id=${x.id})}" method="post" onsubmit='return confirm("Delete this record?")'><button class="btn btn-sm btn-outline-danger">Delete</button></form></td>
</tr></tbody></table>
</div></body></html>
