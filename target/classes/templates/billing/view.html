<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Bill')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<div class="d-flex justify-content-between"><h2>Bill <span th:text="'#' + ${bill.id}"></span></h2>
  <a class="btn btn-outline-secondary btn-sm align-self-start" th:href="@{/billing/{id}/pdf(id=${bill.id})}" target="_blank">Print / PDF receipt</a></div>
<p>Patient: <strong th:text="${bill.patient.fullName}"></strong> &middot; <span th:text="${#temporals.format(bill.createdAt, 'dd MMM yyyy HH:mm')}"></span> &middot;
  <span class="badge" th:classappend="${bill.status == 'PAID'} ? 'bg-success' : 'bg-warning text-dark'" th:text="${bill.status}"></span>
  <span th:if="${bill.paymentMethod != null}" th:text="'via ' + ${bill.paymentMethod}"></span></p>
<table class="table"><thead><tr><th>Item</th><th class="text-end">Amount</th><th></th></tr></thead><tbody>
  <tr th:each="it, st : ${bill.items}"><td th:text="${it.description}"></td><td class="text-end" th:text="${it.amount}"></td>
    <td class="text-end"><form th:if="${bill.status == 'UNPAID'}" th:action="@{/billing/{id}/item/delete/{i}(id=${bill.id},i=${st.index})}" method="post"><button class="btn btn-sm btn-outline-danger">Remove</button></form></td></tr>
  <tr class="table-light"><th>Total</th><th class="text-end" th:text="${bill.total}"></th><th></th></tr>
</tbody></table>
<form th:if="${bill.status == 'UNPAID'}" class="row g-2 mb-3" th:action="@{/billing/{id}/item(id=${bill.id})}" method="post">
  <div class="col-md-6"><input class="form-control" name="description" placeholder="e.g. Consultation fee" required></div>
  <div class="col-md-3"><input class="form-control" type="number" step="0.01" min="0" name="amount" placeholder="Amount" required></div>
  <div class="col-md-3"><button class="btn btn-primary w-100">Add item</button></div>
</form>
<form th:if="${bill.status == 'UNPAID'}" class="row g-2" th:action="@{/billing/{id}/pay(id=${bill.id})}" method="post">
  <div class="col-md-4"><select class="form-select" name="method"><option>Cash</option><option>M-Pesa</option><option>Card</option><option>Insurance</option></select></div>
  <div class="col-md-3"><button class="btn btn-success w-100">Mark as paid</button></div>
</form>
<p class="mt-3"><a th:href="@{/billing}">&larr; All bills</a></p>
</div></body></html>
