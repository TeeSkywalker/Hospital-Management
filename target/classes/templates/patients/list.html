<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Patients')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container pb-5">
<div class="d-flex justify-content-between mb-3"><h2>Patients</h2><a class="btn btn-primary" th:href="@{/patients/new}">+ Add Patient</a></div>
<form class="input-group mb-3" th:action="@{/patients}" method="get">
  <input class="form-control" name="q" th:value="${q}" placeholder="Search by name">
  <button class="btn btn-outline-secondary">Search</button>
</form>
<div class="table-responsive"><table class="table table-striped">
  <thead><tr><th>Name</th><th>Date of birth</th><th>Gender</th><th>Phone</th><th>Email</th><th></th></tr></thead>
  <tbody>
    <tr th:each="x : ${page.content}">
      <td th:text="${x.fullName}"></td><td th:text="${x.dateOfBirth}"></td><td th:text="${x.gender}"></td><td th:text="${x.phone}"></td><td th:text="${x.email}"></td>
      <td class="text-end text-nowrap">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/patients/{id}(id=${x.id})}">View</a>
        <a class="btn btn-sm btn-outline-primary" th:href="@{/patients/edit/{id}(id=${x.id})}">Edit</a>
        <form class="d-inline" sec:authorize="hasRole('ADMIN')" th:action="@{/patients/delete/{id}(id=${x.id})}" method="post" onsubmit='return confirm("Delete this patient?")'><button class="btn btn-sm btn-outline-danger">Delete</button></form>
      </td>
    </tr>
  </tbody>
</table></div>
<div th:replace="~{fragments :: pager(${page}, '/patients')}"></div>
</div></body></html>
