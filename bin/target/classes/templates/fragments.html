<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Hospital Management'">Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Hospital MS</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" th:href="@{/patients}">Patients</a>
      <a class="nav-link" th:href="@{/doctors}">Doctors</a>
      <a class="nav-link" th:href="@{/appointments}">Appointments</a>
    </div>
    <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form>
  </div>
</nav>
</body>
</html>
