<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Appointment')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width:700px">
  <h2 th:text="${appointment.id == null} ? 'Book Appointment' : 'Edit Appointment'"></h2>
  <form th:action="@{/appointments/save}" th:object="${appointment}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label class="form-label">Patient</label>
      <select class="form-select" th:field="*{patient.id}" required>
        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}"></option>
      </select></div>
    <div class="mb-3"><label class="form-label">Doctor</label>
      <select class="form-select" th:field="*{doctor.id}" required>
        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName + ' (' + d.specialization + ')'}"></option>
      </select></div>
    <div class="mb-3"><label class="form-label">Date &amp; time</label>
      <input type="datetime-local" class="form-control" th:field="*{appointmentDate}" required></div>
    <div class="mb-3"><label class="form-label">Reason</label><input class="form-control" th:field="*{reason}"></div>
    <div class="mb-3"><label class="form-label">Status</label>
      <select class="form-select" th:field="*{status}">
        <option value="SCHEDULED">Scheduled</option><option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option>
      </select></div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" th:href="@{/appointments}">Cancel</a>
  </form>
</div>
</body>
</html>
