<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
  <h2 class="mb-4">Dashboard</h2>
  <div class="row g-3">
    <div class="col-md-4"><a class="text-decoration-none" th:href="@{/patients}"><div class="card text-center p-4"><h1 th:text="${patientCount}">0</h1><div>Patients</div></div></a></div>
    <div class="col-md-4"><a class="text-decoration-none" th:href="@{/doctors}"><div class="card text-center p-4"><h1 th:text="${doctorCount}">0</h1><div>Doctors</div></div></a></div>
    <div class="col-md-4"><a class="text-decoration-none" th:href="@{/appointments}"><div class="card text-center p-4"><h1 th:text="${appointmentCount}">0</h1><div>Appointments</div></div></a></div>
  </div>
</div>
</body>
</html>
