<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Doctor')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width:700px">
  <h2 th:text="${doctor.id == null} ? 'Add Doctor' : 'Edit Doctor'"></h2>
  <form th:action="@{/doctors/save}" th:object="${doctor}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" th:field="*{fullName}" required></div>
    <div class="mb-3"><label class="form-label">Specialization</label><input class="form-control" th:field="*{specialization}"></div>
    <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" th:field="*{phone}"></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" th:field="*{email}"></div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" th:href="@{/doctors}">Cancel</a>
  </form>
</div>
</body>
</html>
